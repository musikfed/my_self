name: Generate stable call-me GIF and WebP

on:
  push:
    branches: [main]
    paths:
      - "scripts/build-call-gesture.py"
      - ".github/workflows/generate-call-me.yml"
      - "assets/author-fullbody-call-me.jpg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-call-me-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Generate GIF and animated WebP
        run: python scripts/build-call-gesture.py
      - name: Check frames and stable figure
        run: |
          python - <<'PY'
          from PIL import Image, ImageChops
          paths = ("assets/author-call-me.gif", "assets/author-call-me.gif.webp")
          for p in paths:
              with Image.open(p) as a:
                  assert a.n_frames >= 20, (p, a.n_frames)
                  a.seek(0); first = a.convert("RGB")
                  a.seek(8); moving = a.convert("RGB")
                  assert ImageChops.difference(first, moving).getbbox(), p
                  assert not ImageChops.difference(
                      first.crop((0,round(first.height*.35),first.width,first.height)),
                      moving.crop((0,round(moving.height*.35),moving.width,moving.height))
                  ).getbbox(), "Body flicker: "+p
                  print(p, a.size, a.n_frames)
          PY
      - name: Commit only generated image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/author-call-me.gif assets/author-call-me.gif.webp
          if git diff --cached --quiet; then
            echo "No changes to generated animation"
          else
            git commit -m "Generate real call-me animation from original character"
            git push origin HEAD:main
          fi
